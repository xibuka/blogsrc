name: Build, deploy, and verify Hugo site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugo-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.93.1'

      - name: Build site
        run: hugo --minify --destination /tmp/blogsrc-public

      - name: Deploy site
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: xibuka/xibuka.github.io
          publish_dir: /tmp/blogsrc-public
          keep_files: false
          publish_branch: master
          commit_message: ${{ github.event.head_commit.message || format('Manual deployment {0}', github.sha) }}

      - name: Check deployed website
        run: bash scripts/smoke-test-site.sh https://wenhan.blog
